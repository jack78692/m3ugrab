name: Combine m3u8 Workflow

on:
  push:
    branches:
      - main  # Adjust branch name as needed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'  # Specify your Python version
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # If you have requirements
      
      - name: Lint code with flake8
        run: |
          pip install flake8
          flake8 .  # Adjust to lint specific files or directories
        
      - name: Run tests (if applicable)
        run: |
          # Add commands to run tests here if you have them
        
      - name: Run combine_m3u8.py script
        run: python combine_m3u8.py  # Adjust if script location or name is different
